<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Shortener</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 { font-size: 2.4rem; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 6px; }
    p { color: #555; margin-bottom: 40px; }
    .box { width: 100%; max-width: 500px; }
    input {
      width: 100%;
      padding: 18px 20px;
      font-size: 1.1rem;
      background: #141414;
      border: 1px solid #333;
      border-radius: 12px;
      color: #fff;
      outline: none;
      margin-bottom: 12px;
    }
    input:focus { border-color: #fff; }
    button {
      width: 100%;
      padding: 18px;
      font-size: 1.1rem;
      font-weight: 700;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    .result {
      margin-top: 28px;
      padding: 22px;
      background: #141414;
      border: 1px solid #333;
      border-radius: 12px;
      text-align: center;
      display: none;
    }
    .result a {
      color: #4ade80;
      font-size: 1.35rem;
      font-family: monospace;
      word-break: break-all;
      text-decoration: none;
    }
    .copy {
      margin-top: 14px;
      background: transparent;
      color: #777;
      border: 1px solid #333;
      font-size: 0.9rem;
      padding: 8px 18px;
      width: auto;
    }
    .error { color: #f87171; margin-top: 18px; display: none; }
  </style>
</head>
<body>
  <h1>ULTIMATE SHORTENER</h1>
  <p>your domain • shortest possible codes</p>

  <div class="box">
    <input type="url" id="url" placeholder="paste long link..." required>
    <button id="btn" onclick="shorten()">MAKE IT TINY</button>

    <div class="result" id="result">
      <div style="color:#666;font-size:0.85rem;margin-bottom:8px">your link:</div>
      <a id="shortLink" href="#" target="_blank"></a><br>
      <button class="copy" onclick="copy()">copy</button>
    </div>
    <div class="error" id="error"></div>
  </div>

  <script>
    async function shorten() {
      const url = document.getElementById('url').value.trim();
      const btn = document.getElementById('btn');
      const result = document.getElementById('result');
      const error = document.getElementById('error');
      const shortLink = document.getElementById('shortLink');

      if (!url) return;

      btn.disabled = true;
      btn.textContent = 'working...';
      result.style.display = 'none';
      error.style.display = 'none';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (data.shortUrl) {
          shortLink.href = data.shortUrl;
          shortLink.textContent = data.shortUrl;
          result.style.display = 'block';
        } else {
          throw new Error(data.error || 'Failed');
        }
      } catch (err) {
        error.textContent = err.message;
        error.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'MAKE IT TINY';
      }
    }

    function copy() {
      navigator.clipboard.writeText(document.getElementById('shortLink').textContent);
    }

    document.getElementById('url').addEventListener('keydown', e => {
      if (e.key === 'Enter') shorten();
    });
  </script>
</body>
</html>
